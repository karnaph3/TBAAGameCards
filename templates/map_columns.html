<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Map Columns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4 text-center">Map Your Game Details</h2>
        <h4 class="mb-4 text-center">Match the columns from your file to the required fields for filling out a game card.</h4>
        <form method="POST" action="/generate-pdf" class="card p-4 shadow-sm">
            <input type="hidden" name="temp_dir" value="{{ temp_dir }}">
            <div class="row mb-2 fw-bold">
                <div class="col-sm-3">Game card field</div>
                <div class="col-sm-9">Column name in your file</div>
            </div>
            {% for field in fields %}
            <div class="mb-3 row align-items-center">
                <label class="col-sm-3 col-form-label">{{ field.replace("_", " ") }}</label>
                <div class="col-sm-9">
                    <select class="form-select" name="{{ field }}" required>
                        <option value="" disabled selected>Select column</option>
                        {% for col in columns %}
                        <option value="{{ col }}">{{ col.replace('_', ' ') }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            {% endfor %}

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success">Generate PDF</button>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">← Back to Home</a>
            </div>

            <h4 class="mt-5">Preview Uploaded File</h4>
            <div class="text-center mb-3">
                <a href="{{ url_for('edit_table', temp_dir=temp_dir) }}" class="btn btn-warning">Edit Table</a>
            </div>
            <div class="table-responsive" style="max-height: 400px; overflow: auto;">
                {{ table_preview | safe }}
            </div>
        </form>
    </div>
</body>
</html>
